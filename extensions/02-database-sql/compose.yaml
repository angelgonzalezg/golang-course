services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: sql_lab
      POSTGRES_PASSWORD: sql_lab_local
      POSTGRES_DB: sql_lab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18+ keeps its versioned data directory below this location.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sql_lab -d sql_lab"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
